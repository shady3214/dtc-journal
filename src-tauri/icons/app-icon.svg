<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="green" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="red" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle top glow -->
  <rect x="0" y="0" width="1024" height="512" rx="220" ry="220" fill="url(#glow)"/>

  <!-- Grid lines (subtle) -->
  <line x1="160" y1="340" x2="864" y2="340" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
  <line x1="160" y1="460" x2="864" y2="460" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
  <line x1="160" y1="580" x2="864" y2="580" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
  <line x1="160" y1="700" x2="864" y2="700" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>

  <!-- Uptrend line (subtle glow behind candles) -->
  <line x1="220" y1="700" x2="804" y2="320" stroke="#7c3aed" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round"/>

  <!-- Candlestick 1 (Green / Bullish) - leftmost -->
  <!-- Wick -->
  <line x1="270" y1="350" x2="270" y2="720" stroke="url(#green)" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="232" y="450" width="76" height="180" rx="8" fill="url(#green)"/>

  <!-- Candlestick 2 (Red / Bearish) -->
  <!-- Wick -->
  <line x1="420" y1="300" x2="420" y2="680" stroke="url(#red)" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="382" y="360" width="76" height="200" rx="8" fill="url(#red)"/>

  <!-- Candlestick 3 (Green / Bullish) - tallest -->
  <!-- Wick -->
  <line x1="570" y1="250" x2="570" y2="650" stroke="url(#green)" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="532" y="320" width="76" height="220" rx="8" fill="url(#green)"/>

  <!-- Candlestick 4 (Red / Bearish) - small pullback -->
  <!-- Wick -->
  <line x1="720" y1="280" x2="720" y2="580" stroke="url(#red)" stroke-width="8" stroke-linecap="round"/>
  <!-- Body -->
  <rect x="682" y="340" width="76" height="140" rx="8" fill="url(#red)"/>

  <!-- "DTC" text at bottom -->
  <text x="512" y="870" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="110" fill="url(#accent)" text-anchor="middle" letter-spacing="16">DTC</text>

  <!-- Thin accent border -->
  <rect x="8" y="8" width="1008" height="1008" rx="216" ry="216" fill="none" stroke="#7c3aed" stroke-opacity="0.15" stroke-width="4"/>
</svg>
